    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAxzefDnbYT4KTTiDm4S_okltTehCwM6SM",
        authDomain: "planning-reparation.firebaseapp.com",
        projectId: "planning-reparation",
        storageBucket: "planning-reparation.firebasestorage.app",
        messagingSenderId: "90928624441",
        appId: "1:90928624441:web:97b3abd153c16e40486ee8",
        measurementId: "G-H3L7RTXSZK"
      };

      const app = initializeApp(firebaseConfig);
      
      const db = initializeFirestore(app, {
        localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})
      });

      window.db = db;
      window.FB_SDK = { collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc };
      window.dispatchEvent(new Event('firebase-ready'));

<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
    <div id="root"></div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        /* ==============================================================================
           SYSTÈME DE SÉCURITÉ
           ============================================================================== */
        function ProtectedApp() {
            const [isAuthenticated, setIsAuthenticated] = useState(() => {
                return sessionStorage.getItem('auth') === 'true' || localStorage.getItem('auth') === 'true';
            });
            const [passwordInput, setPasswordInput] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [rememberMe, setRememberMe] = useState(false);
            const [error, setError] = useState(false);

            const SECRET_PASSWORD = "techencarton"; 

            const handleLogin = (e) => {
                e.preventDefault();
                if (passwordInput === SECRET_PASSWORD) {
                    if (rememberMe) {
                        localStorage.setItem('auth', 'true');
                    } else {
                        sessionStorage.setItem('auth', 'true');
                    }
                    setIsAuthenticated(true);
                } else {
                    setError(true);
                }
            };

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-900 p-4 transition-colors duration-200">
                        <form onSubmit={handleLogin} className="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-md w-full max-w-sm border border-gray-200 dark:border-gray-700">
                            <h2 className="text-xl font-bold text-gray-900 dark:text-white mb-4 text-center">🔒 Accès Sécurisé</h2>
                            <p className="text-sm text-gray-600 dark:text-gray-400 mb-6 text-center">Entrez le mot de passe de l'atelier pour accéder au planning.</p>
                            <input 
                                type={showPassword ? "text" : "password"} 
                                placeholder="Mot de passe..." 
                                value={passwordInput} 
                                onChange={(e) => { setPasswordInput(e.target.value); setError(false); }} 
                                className="w-full border border-gray-300 dark:border-gray-600 rounded-md p-3 mb-4 outline-none bg-white dark:bg-gray-700 text-black dark:text-white text-center font-bold"
                                autoFocus
                            />
                            
                            <div className="flex flex-col space-y-3 mb-6 text-sm text-gray-600 dark:text-gray-300">
                                <div className="flex items-center justify-center">
                                    <input type="checkbox" id="showPass" checked={showPassword} onChange={() => setShowPassword(!showPassword)} className="mr-2 cursor-pointer w-4 h-4" />
                                    <label htmlFor="showPass" className="cursor-pointer select-none">Afficher le mot de passe</label>
                                </div>
                                <div className="flex items-center justify-center bg-gray-50 dark:bg-gray-700/50 p-2 rounded-md border border-gray-200 dark:border-gray-600">
                                    <input type="checkbox" id="rememberMe" checked={rememberMe} onChange={() => setRememberMe(!rememberMe)} className="mr-2 cursor-pointer w-4 h-4 text-blue-600" />
                                    <label htmlFor="rememberMe" className="cursor-pointer select-none font-bold text-gray-800 dark:text-gray-200">Se souvenir de moi</label>
                                </div>
                            </div>

                            {error && <p className="text-red-500 text-xs mb-3 text-center font-bold">Mot de passe incorrect</p>}
                            <button type="submit" className="w-full bg-blue-600 text-white font-medium py-3 rounded-md hover:bg-blue-700 transition">Se connecter</button>
                        </form>
                    </div>
                );
            }
            return <AppContent />;
        }

        const getLocalISO = (d) => {
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          return `${y}-${m}-${day}`;
        };

        const getVendeurColor = (vendeurName) => {
            switch(vendeurName) {
                case 'Clément': return 'bg-blue-500';
                case 'Bérénys': return 'bg-red-500';
                case 'Gérard': return 'bg-green-500';
                default: return 'bg-gray-400';
            }
        };

        const CheckRow = ({ category, label, options, itemName, formSync, updateCategorySync }) => (
          <div className="grid grid-cols-4 border-b border-black text-xs">
            <div className="border-r border-black p-1 bg-blue-100 flex items-center font-semibold text-black">{label}</div>
            {options.map(opt => (
              <div key={opt} className="border-r border-black p-1 flex justify-center items-center cursor-pointer hover:bg-gray-200 bg-white" onClick={() => updateCategorySync(category, itemName, opt)}>
                {formSync[category]?.[itemName] === opt ? <span className="font-bold text-sm text-black">X</span> : <span className="text-gray-300">□</span>}
              </div>
            ))}
          </div>
        );

        /* === FICHE PRISE EN CHARGE MODIFIABLE === */
        const FormHalf = ({ title, activeIntake, formSync, updateSync, updateCategorySync }) => (
          <div className="border-2 border-black p-4 bg-white text-black h-full flex flex-col justify-between shadow-sm">
            <div>
                <h2 className="text-center font-bold text-lg mb-4 text-black">{title}</h2>
                <div className="grid grid-cols-4 gap-0 border-t border-l border-black text-xs text-center mb-2 font-bold bg-blue-200 text-black">
                  <div className="border-r border-b border-black p-1">DATE</div>
                  <div className="border-r border-b border-black p-1">N° TÉL.</div>
                  <div className="border-r border-b border-black p-1">MODELE</div>
                  <div className="border-r border-b border-black p-1">ACCESSOIRE</div>
                </div>
                <div className="grid grid-cols-4 gap-0 border-l border-black text-xs text-center mb-4 text-black">
                  <div className="border-r border-b border-black p-1 bg-white flex justify-center items-center">{new Date(activeIntake.date).toLocaleDateString('fr-FR', {day: '2-digit', month: '2-digit', year: 'numeric'})}</div>
                  
                  {/* MODIFIABLE: Téléphone Client */}
                  <input className="border-r border-b border-black p-1 text-center outline-none bg-white text-blue-800 font-bold focus:bg-blue-50 w-full" placeholder="06..." value={formSync.clientPhone} onChange={(e) => updateSync('clientPhone', e.target.value)} />
                  
                  {/* MODIFIABLE: Modèle de l'appareil */}
                  <input className="border-r border-b border-black p-1 text-center outline-none bg-white text-blue-800 font-bold focus:bg-blue-50 w-full" placeholder="Modèle..." value={formSync.phone} onChange={(e) => updateSync('phone', e.target.value)} />
                  
                  <input className="border-r border-b border-black p-1 text-center outline-none bg-white text-black focus:bg-blue-50 w-full" value={formSync.accessoire} onChange={(e) => updateSync('accessoire', e.target.value)} />
                </div>
                <div className="grid grid-cols-4 border border-black mb-4 text-xs">
                  <div className="p-1 font-bold border-r border-black bg-blue-200 text-black flex items-center">NOM DU CLIENT</div>
                  {/* MODIFIABLE: Nom Client */}
                  <input className="col-span-3 p-1 font-bold bg-white text-blue-800 outline-none focus:bg-blue-50 w-full uppercase" value={formSync.client} onChange={(e) => updateSync('client', e.target.value)} />
                </div>
                <div className="border-t border-l border-black mb-4">
                  <div className="bg-blue-300 font-bold text-center border-r border-b border-black p-1 text-sm text-black">ÉTAT DE L'APPAREIL</div>
                  <div className="grid grid-cols-4 border-b border-black text-xs font-bold text-center bg-blue-200 text-black">
                    <div className="border-r border-black p-1"></div><div className="border-r border-black p-1">CASSÉ</div>
                    <div className="border-r border-black p-1">RAYÉ/USÉE</div><div className="border-r border-black p-1">OK</div>
                  </div>
                  <CheckRow category="etat" label="ECRAN AVANT" options={['CASSÉ', 'RAYÉ', 'OK']} itemName="ecran" formSync={formSync} updateCategorySync={updateCategorySync} />
                  <CheckRow category="etat" label="VITRE ARRIÈRE" options={['CASSÉ', 'RAYÉ', 'OK']} itemName="vitre" formSync={formSync} updateCategorySync={updateCategorySync} />
                  <CheckRow category="etat" label="CHASSIS" options={['CASSÉ', 'RAYÉ', 'OK']} itemName="chassis" formSync={formSync} updateCategorySync={updateCategorySync} />
                  <CheckRow category="etat" label="LENTILLE" options={['CASSÉ', 'RAYÉ', 'OK']} itemName="lentille" formSync={formSync} updateCategorySync={updateCategorySync} />
                </div>
                <div className="border-t border-l border-black mb-4">
                  <div className="bg-blue-300 font-bold text-center border-r border-b border-black p-1 text-sm text-black">FONCTION DE L'APPAREIL</div>
                  <div className="grid grid-cols-4 border-b border-black text-xs font-bold text-center bg-blue-200 text-black">
                    <div className="border-r border-black p-1"></div><div className="border-r border-black p-1">OUI</div>
                    <div className="border-r border-black p-1">NON</div><div className="border-r border-black p-1">NON TESTABLE</div>
                  </div>
                  <CheckRow category="fonction" label="Ecran allumé" options={['OUI', 'NON', 'NT']} itemName="allume" formSync={formSync} updateCategorySync={updateCategorySync} />
                  <CheckRow category="fonction" label="Tactile" options={['OUI', 'NON', 'NT']} itemName="tactile" formSync={formSync} updateCategorySync={updateCategorySync} />
                  <CheckRow category="fonction" label="Face ID" options={['OUI', 'NON', 'NT']} itemName="bio" formSync={formSync} updateCategorySync={updateCategorySync} />
                  <CheckRow category="fonction" label="App photo avant" options={['OUI', 'NON', 'NT']} itemName="camAvant" formSync={formSync} updateCategorySync={updateCategorySync} />
                  <CheckRow category="fonction" label="App photo arr." options={['OUI', 'NON', 'NT']} itemName="camArr" formSync={formSync} updateCategorySync={updateCategorySync} />
                  <CheckRow category="fonction" label="Haut parleur" options={['OUI', 'NON', 'NT']} itemName="audio" formSync={formSync} updateCategorySync={updateCategorySync} />
                  <CheckRow category="fonction" label="Charge/USB" options={['OUI', 'NON', 'NT']} itemName="charge" formSync={formSync} updateCategorySync={updateCategorySync} />
                  <CheckRow category="fonction" label="Boutons lat." options={['OUI', 'NON', 'NT']} itemName="boutons" formSync={formSync} updateCategorySync={updateCategorySync} />
                  <CheckRow category="fonction" label="Réseau/Wifi" options={['OUI', 'NON', 'NT']} itemName="reseau" formSync={formSync} updateCategorySync={updateCategorySync} />
                </div>
                <div className="grid grid-cols-2 gap-4 mb-4">
                   <div className="border-t border-l border-black">
                      <div className="grid grid-cols-3 text-xs text-center font-bold bg-blue-200 border-b border-r border-black text-black">
                         <div className="border-r border-black p-1">Oxydation</div><div className="border-r border-black p-1">OUI</div><div className="p-1">NON</div>
                      </div>
                      <div className="grid grid-cols-3 text-xs text-center border-b border-r border-black text-black">
                         <div className="border-r border-black p-1 bg-blue-100 font-bold flex items-center justify-center">Oxydation</div>
                         <div className="border-r border-black p-1 cursor-pointer bg-white flex items-center justify-center" onClick={() => updateSync('oxydation', 'OUI')}>{formSync.oxydation === 'OUI' ? 'X' : ''}</div>
                         <div className="p-1 cursor-pointer bg-white flex items-center justify-center" onClick={() => updateSync('oxydation', 'NON')}>{formSync.oxydation === 'NON' ? 'X' : ''}</div>
                      </div>
                   </div>
                   <div className="border-t border-l border-black">
                      <div className="grid grid-cols-3 text-xs text-center font-bold bg-blue-200 border-b border-r border-black text-black">
                         <div className="border-r border-black p-1">SIM</div><div className="border-r border-black p-1">OUI</div><div className="p-1">NON</div>
                      </div>
                      <div className="grid grid-cols-3 text-xs text-center border-b border-r border-black text-black">
                         <div className="border-r border-black p-1 bg-blue-100 font-bold flex items-center justify-center">SIM</div>
                         <div className="border-r border-black p-1 cursor-pointer bg-white flex items-center justify-center" onClick={() => updateSync('sim', 'OUI')}>{formSync.sim === 'OUI' ? 'X' : ''}</div>
                         <div className="p-1 cursor-pointer bg-white flex items-center justify-center" onClick={() => updateSync('sim', 'NON')}>{formSync.sim === 'NON' ? 'X' : ''}</div>
                      </div>
                   </div>
                </div>
                <div className="grid grid-cols-3 gap-0 border border-black mb-4 text-xs">
                  <div className="border-r border-black flex">
                    <span className="bg-blue-200 p-1 font-bold border-r border-black text-black flex items-center">Code déverr.</span>
                    <input className="w-full p-1 outline-none text-center bg-white text-black" value={formSync.codeDev} onChange={e => updateSync('codeDev', e.target.value)} />
                  </div>
                  <div className="border-r border-black flex">
                    <span className="bg-blue-200 p-1 font-bold border-r border-black text-black flex items-center">Code sim</span>
                    <input className="w-full p-1 outline-none text-center bg-white text-black" value={formSync.codeSim} onChange={e => updateSync('codeSim', e.target.value)} />
                  </div>
                  <div className="flex bg-white">
                    <span className="bg-blue-200 p-1 font-bold border-r border-black text-black flex items-center">VENDEUR</span>
                    <select className="w-full p-1 outline-none text-center font-bold uppercase bg-white text-black cursor-pointer" value={formSync.vendeur} onChange={e => updateSync('vendeur', e.target.value)} style={{ textAlignLast: 'center' }}>
                      <option value="">- CHOISIR -</option>
                      <option value="Clément">CLÉMENT</option>
                      <option value="Bérénys">BÉRÉNYS</option>
                      <option value="Gérard">GÉRARD</option>
                    </select>
                  </div>
                </div>
                <div className="border-t border-l border-black mb-4">
                  <div className="bg-blue-300 font-bold text-center border-r border-b border-black p-1 text-sm text-black">DEVIS DE RÉPARATION</div>
                  <div className="grid grid-cols-2 border-b border-black text-xs font-bold text-center bg-blue-200 text-black">
                    <div className="border-r border-black p-1">RÉPARATION</div><div className="border-r border-black p-1">PRIX</div>
                  </div>
                  <div className="grid grid-cols-2 border-b border-black text-xs text-center text-black">
                    {/* MODIFIABLE: Réparation */}
                    <input className="border-r border-black p-1 font-bold text-center bg-white text-blue-800 outline-none focus:bg-blue-50 w-full" value={formSync.repair} onChange={(e) => updateSync('repair', e.target.value)} />
                    <div className="border-r border-black p-1 flex items-center justify-center bg-white"><input type="number" className="w-16 text-center outline-none border-b border-dashed border-gray-400 mr-1 bg-white text-black" value={formSync.prix} onChange={e => updateSync('prix', e.target.value)} /> €</div>
                  </div>
                </div>
                
                {/* --- MENTION RGPD --- */}
                <div className="mt-2 mb-2 p-2 border border-gray-400 bg-gray-50 text-[9px] text-gray-700 leading-tight">
                    <p>En signant ce document, le client accepte que ses données personnelles (nom, numéro de téléphone) soient conservées par l'atelier dans le seul but de gérer le suivi de la réparation et l'éventuelle garantie (SAV) de l'appareil, conformément à la réglementation RGPD en vigueur.</p>
                </div>

            </div>
            <div>
                <div className="border-t border-l border-black mb-4 flex flex-col">
                  <div className="bg-blue-300 font-bold text-center border-r border-b border-black p-1 text-xs text-black">COMMENTAIRE</div>
                  <textarea className="w-full h-12 p-2 text-xs border-r border-b border-black outline-none resize-none bg-white text-black" value={formSync.commentaire} onChange={e => updateSync('commentaire', e.target.value)} />
                </div>
                <div className="border border-black h-20 relative bg-white"><div className="bg-blue-200 font-bold text-center border-b border-black p-1 text-xs text-black">SIGNATURE (Accord Réparation & Données)</div></div>
            </div>
          </div>
        );

        const IntakeView = ({ activeIntake, setView }) => {
          const [formSync, setFormSync] = useState(() => {
              const baseData = { 
                  client: activeIntake.client || '', 
                  clientPhone: activeIntake.clientPhone || '', 
                  phone: activeIntake.phone || '', 
                  repair: activeIntake.repair || '', 
                  vendeur: activeIntake.vendeur || '', 
                  prix: activeIntake.prix || '', 
                  accessoire: '', commentaire: '', codeDev: '', codeSim: '', etat: {}, fonction: {}, oxydation: '', sim: '' 
              };
              if (activeIntake.intakeData) {
                  return { ...baseData, ...activeIntake.intakeData };
              }
              return baseData;
          });
          
          const updateSync = (field, value) => setFormSync(prev => ({ ...prev, [field]: value }));
          const updateCategorySync = (category, item, value) => setFormSync(prev => ({ ...prev, [category]: { ...prev[category], [item]: value } }));

          const saveIntakeData = () => {
              const { doc, updateDoc } = window.FB_SDK;
              updateDoc(doc(window.db, "repairs", activeIntake.id), { 
                  client: formSync.client,
                  clientPhone: formSync.clientPhone,
                  phone: formSync.phone,
                  repair: formSync.repair,
                  vendeur: formSync.vendeur,
                  prix: formSync.prix,
                  intakeData: formSync 
              })
              .then(() => alert("✅ Fiche de prise en charge et données du planning sauvegardées avec succès !"))
              .catch((err) => { console.error(err); alert("Erreur lors de la sauvegarde."); });
          };

          return (
            <div className="min-h-screen bg-gray-100 dark:bg-gray-900 p-4 print:p-0 print:bg-white text-black transition-colors duration-200 overflow-auto flex-1 w-full">
              <div className="max-w-6xl mx-auto h-full">
                <div className="flex justify-between items-center mb-4 print:hidden">
                  <button onClick={() => setView('planning')} className="bg-gray-800 dark:bg-gray-700 text-white px-4 py-2 rounded shadow hover:bg-gray-700 dark:hover:bg-gray-600 transition">&larr; Retour au planning</button>
                  <h1 className="text-xl font-bold text-gray-900 dark:text-white">Bon de prise en charge</h1>
                  <div className="flex gap-2">
                      <button onClick={saveIntakeData} className="bg-green-600 text-white px-4 py-2 rounded shadow hover:bg-green-700 font-bold flex items-center transition">
                          💾 Sauvegarder
                      </button>
                      <button onClick={() => window.print()} className="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 font-bold flex items-center transition">
                          🖨️ Imprimer (A4)
                      </button>
                  </div>
                </div>
                
                <div className="mb-4 bg-blue-50 dark:bg-blue-900/30 border-l-4 border-blue-500 p-3 rounded text-sm text-blue-800 dark:text-blue-300 print:hidden">
                    💡 <strong>Astuce :</strong> Vous pouvez modifier le nom du client, le téléphone, le modèle et la réparation directement sur ce bon. N'oubliez pas de cliquer sur <strong>Sauvegarder</strong> pour mettre à jour le planning !
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 h-full print:gap-4 print:h-screen print:grid-cols-2">
                  <FormHalf title="EXEMPLAIRE BOUTIQUE" activeIntake={activeIntake} formSync={formSync} updateSync={updateSync} updateCategorySync={updateCategorySync} />
                  <FormHalf title="EXEMPLAIRE CLIENT" activeIntake={activeIntake} formSync={formSync} updateSync={updateSync} updateCategorySync={updateCategorySync} />
                </div>
              </div>
            </div>
          );
        };

        // --- PAGE: BLOC NOTES D'ÉQUIPE ---
        const TeamMessagesView = ({ setView, onOpenNav }) => {
            const [messages, setMessages] = useState([]);
            const [text, setText] = useState('');
            const [author, setAuthor] = useState('');
            const [activeTab, setActiveTab] = useState('actifs');

            useEffect(() => {
                const { collection, onSnapshot } = window.FB_SDK;
                const unsubscribe = onSnapshot(collection(window.db, "team_notes"), (snapshot) => {
                    const loaded = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    })).sort((a, b) => b.createdAt - a.createdAt);
                    setMessages(loaded);
                });
                return unsubscribe;
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!author || !text) return;
                const { collection, addDoc } = window.FB_SDK;
                await addDoc(collection(window.db, "team_notes"), {
                    author, text, createdAt: Date.now(), status: 'active'
                });
                setText('');
            };

            const markAsSeen = async (id) => {
                const { doc, updateDoc } = window.FB_SDK;
                await updateDoc(doc(window.db, "team_notes", id), {
                    status: 'archived', seenAt: Date.now()
                });
            };

            const unarchiveMessage = async (id) => {
                const { doc, updateDoc } = window.FB_SDK;
                await updateDoc(doc(window.db, "team_notes", id), {
                    status: 'active', seenAt: null
                });

                const getWeekNumber = (d) => {
                    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
                    const dayNum = date.getUTCDay() || 7;
                    date.setUTCDate(date.getUTCDate() + 4 - dayNum);
                    const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
                    return Math.ceil((((date - yearStart) / 86400000) + 1)/7);
                };
                const isSameWeek = (d1, d2) => d1.getFullYear() === d2.getFullYear() && getWeekNumber(d1) === getWeekNumber(d2);
                const isSameMonth = (d1, d2) => d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth();
                const isSameYear = (d1, d2) => d1.getFullYear() === d2.getFullYear();

                let totalCompleted = 0;
                let sellerCount = { 'Clément': 0, 'Bérénys': 0, 'Gérard': 0 };

        function AppContent() {
          const [repairs, setRepairs] = useState([]);
          const [currentDate, setCurrentDate] = useState(new Date());
          const [view, setView] = useState('planning');
          const [activeIntake, setActiveIntake] = useState(null);
          const [isNavOpen, setIsNavOpen] = useState(false);
          const [expandedPieces, setExpandedPieces] = useState({});
          
          const [searchTerm, setSearchTerm] = useState("");
          const [activeNotesCount, setActiveNotesCount] = useState(0);

          const [formData, setFormData] = useState({ 
              client: '', clientPhone: '', phone: '', repair: '', date: getLocalISO(new Date()), 
              pieces: [], customPiece: '', pieceSuppliers: {}, customPieceSuppliers: {},
              isSAV: false, vendeur: ''
          });
          
          const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');

          useEffect(() => {
              const today = new Date();
              let targetDate = new Date(today);

              if (formData.pieces.length > 0) {
                  if (today.getDay() === 6) { 
                      targetDate.setDate(today.getDate() + 3); 
                  } else {
                      targetDate.setDate(today.getDate() + 1); 
                  }
              } else {
                  targetDate = today; 
              }

              const newDateISO = getLocalISO(targetDate);
              setFormData(prev => {
                  if (prev.date !== newDateISO) {
                      return { ...prev, date: newDateISO };
                  }
                  return prev;
              });
          }, [formData.pieces]);

          useEffect(() => {
            const handleFirebaseReady = () => {
              const { collection, onSnapshot } = window.FB_SDK;
              
              const unsubscribeRepairs = onSnapshot(collection(window.db, "repairs"), (snapshot) => {
                const loadedRepairs = snapshot.docs.map(doc => ({
                  id: doc.id,
                  ...doc.data()
                }));
                setRepairs(loadedRepairs);
              });

              // Écoute pour le compteur de messages d'équipe non lus
              const unsubscribeNotes = onSnapshot(collection(window.db, "team_notes"), (snapshot) => {
                  let count = 0;
                  snapshot.forEach(doc => {
                      if(doc.data().status === 'active') count++;
                  });
                  setActiveNotesCount(count);
              });

              return () => {
                  unsubscribeRepairs();
                  unsubscribeNotes();
              };
            };

            if (window.FB_SDK) {
              handleFirebaseReady();
            } else {
              window.addEventListener('firebase-ready', handleFirebaseReady);
            }
          }, []);

          useEffect(() => {
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
          }, [isDarkMode]);

          const weekDates = (() => {
            const curr = new Date(currentDate);
            const day = curr.getDay() || 7; 
            const monday = new Date(curr);
            monday.setDate(curr.getDate() - day + 1); 
            const days = [];
            for (let i = 0; i < 6; i++) { 
              const d = new Date(monday);
              d.setDate(monday.getDate() + i);
              days.push(d);
            }
            return days;
          })();

          const handleSubmit = (e) => {
            e.preventDefault();
            if (!formData.client || !formData.phone || !formData.repair) return;
            let submitDate = formData.date;
            const dCheck = new Date(submitDate);
            if (dCheck.getDay() === 0) {
                dCheck.setDate(dCheck.getDate() + 1); 
                submitDate = getLocalISO(dCheck);
            }
            
            let finalPieceStrings = [];
            formData.pieces.forEach(p => {
                let pName = p;
                if (p === 'Autre' && formData.customPiece) {
                    pName = formData.customPiece;

            e.preventDefault();
            e.stopPropagation();
            const draggedId = e.dataTransfer.getData('repairId');
            if (!draggedId || draggedId === targetRepairId) return;

            const draggedRepair = repairs.find(r => r.id === draggedId);
            if (!draggedRepair) return;

            let targetDayRepairs = repairs.filter(r => r.date === targetDateStr && r.status !== 'archived').sort((a, b) => {
                if (a.isPriority && !b.isPriority) return -1;
                if (!a.isPriority && b.isPriority) return 1;
                return (a.order || 0) - (b.order || 0);
            });

            targetDayRepairs = targetDayRepairs.filter(r => r.id !== draggedId);

            if (targetRepairId) {
                const targetIndex = targetDayRepairs.findIndex(r => r.id === targetRepairId);
                if (targetIndex !== -1) {
                    targetDayRepairs.splice(targetIndex, 0, draggedRepair);
                } else {
                    targetDayRepairs.push(draggedRepair);
                }
            } else {
                targetDayRepairs.push(draggedRepair);
            }

            const { doc, updateDoc } = window.FB_SDK;
            targetDayRepairs.forEach((rep, index) => {
                const newOrder = index * 10;
                if (rep.id === draggedId) {
                    updateDoc(doc(window.db, "repairs", rep.id), { date: targetDateStr, order: newOrder }).catch(console.error);

                              value={searchTerm}
                              onChange={(e) => setSearchTerm(e.target.value)}
                              className="bg-transparent border-none outline-none w-full ml-3 text-sm text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400"
                          />
                          {searchTerm && <button onClick={() => setSearchTerm('')} className="text-gray-400 hover:text-red-500 font-bold ml-2">&times;</button>}
                      </div>
                      
                      <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 bg-gray-100 dark:bg-gray-700 rounded-full hover:bg-gray-200 dark:hover:bg-gray-600 transition shrink-0">
                          {isDarkMode ? '☀️' : '🌙'}
                      </button>
                    </div>

                    <div className="flex-1 p-2 sm:p-4 overflow-y-auto overflow-x-hidden">
                      {searchTerm ? (
                          <div className="max-w-4xl mx-auto bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                              <h2 className="text-xl font-bold mb-6 text-gray-900 dark:text-white">Résultats pour "{searchTerm}"</h2>
                              {filteredRepairs.length === 0 ? (
                                  <p className="text-gray-500 text-center py-8">Aucune fiche ne correspond à cette recherche.</p>
                              ) : (
                                  <div className="space-y-3">
                                      {filteredRepairs.map(r => (
                                          <div key={r.id} className="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 border border-gray-200 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-750 transition gap-4">
                                              <div>
                                                  <p className="font-bold text-lg text-gray-900 dark:text-white">{r.client} <span className="text-blue-600 dark:text-blue-400 text-base font-normal ml-2">📞 {r.clientPhone}</span></p>
                                                  <p className="text-sm font-medium text-gray-700 dark:text-gray-300 mt-1">{r.phone} : {r.repair}</p>
                                                  <span className={`text-xs px-2 py-1 rounded font-bold mt-2 inline-block ${r.status === 'archived' ? 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300' : 'bg-green-100 dark:bg-green-900/40 text-green-800 dark:text-green-400'}`}>
                                                      {r.status === 'archived' ? 'Archivé' : 'En cours'}
                                                  </span>
                                              </div>
                                              <button onClick={() => { setActiveIntake(r); setView('intake'); setSearchTerm(''); }} className="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-md font-bold shadow-sm transition">
                                                  Ouvrir
                                              </button>
                                          </div>
                                      ))}
                                  </div>
                              )}
                          </div>
                      ) : (
                          <div className="grid grid-cols-3 lg:grid-cols-6 gap-2 sm:gap-3 h-auto lg:h-full min-h-[500px] lg:min-h-0">
                            {weekDates.map((date, idx) => {
                              const dateStr = getLocalISO(date);
                              const isToday = dateStr === getLocalISO(new Date());
                              
                              const dayRepairs = repairs.filter(r => r.date === dateStr && r.status !== 'archived').sort((a, b) => {
                                  if (a.isPriority && !b.isPriority) return -1;
                                  if (!a.isPriority && b.isPriority) return 1;
                                  return (a.order || 0) - (b.order || 0);
                              });

                              return (
                                <div key={idx} 
                                     onDragOver={e=>e.preventDefault()} 
                                     onDrop={(e) => handleDrop(e, dateStr)} 
                                     className={`flex flex-col rounded-lg overflow-hidden transition-all duration-200 min-h-[300px] lg:min-h-0
                                     ${isToday ? 'bg-blue-50 dark:bg-blue-900/10 border-2 border-blue-500 shadow-md' : 'bg-gray-100 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700'}`}>
                                  
                                  <div className={`p-1 sm:p-2 text-center border-b font-bold text-xs sm:text-sm 
                                                  ${isToday ? 'bg-blue-600 text-white border-blue-600' : 'bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 border-gray-300 dark:border-gray-600'}`}>
                                    {['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'][date.getDay()]} <br className="lg:hidden" /> {String(date.getDate()).padStart(2, '0')}/{String(date.getMonth() + 1).padStart(2, '0')}
                                  </div>
                                  
                                  <div className="flex-1 overflow-y-auto p-1 sm:p-2 space-y-2">
                                    {dayRepairs.map(repair => (
                                      <div key={repair.id} 
                                           draggable 
                                           onDragStart={(e) => e.dataTransfer.setData('repairId', repair.id)} 
                                           onDragOver={(e) => e.preventDefault()}
                                           onDrop={(e) => handleDrop(e, dateStr, repair.id)}
                                           className={`p-2 sm:p-3 rounded-md border text-sm cursor-grab border-opacity-50 ${getStatusColors(repair)} relative`}
                                      >
                                        <div className="font-bold flex justify-between items-start mb-1 text-black dark:text-white">
                                          <div className="flex flex-col truncate pr-2 w-full">
                                            <span className="text-xs sm:text-sm truncate flex items-center">
                                                {/* PASTILLE DE COULEUR VENDEUR */}
                                                {repair.vendeur && (
                                                    <span className={`inline-block w-2.5 h-2.5 rounded-full mr-1.5 shrink-0 ${getVendeurColor(repair.vendeur)}`} title={`Vendeur: ${repair.vendeur}`}></span>
                                                )}
                                                {repair.client}
                                            </span>
                                          </div>
                                          <div className="flex space-x-1 flex-shrink-0">
                                              {repair.status !== 'done' && (
                                                  <button 
                                                      onClick={() => togglePriority(repair.id, repair.isPriority)}
                                                      className={`text-[10px] px-1.5 py-0.5 rounded shadow-sm transition ${repair.isPriority ? 'bg-red-500 hover:bg-red-600 text-white' : 'bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300'}`}
                                                      title="Mettre en priorité"
                                                  >
                                                      {repair.isPriority ? '🔥 Urgent' : '⭐'}
                                                  </button>
                                              )}
                                              {repair.status === 'done' && <span className="text-green-700 dark:text-green-400 font-bold ml-1">✓</span>}
                                              {repair.status === 'waiting' && <span className="text-yellow-700 dark:text-yellow-400 font-bold ml-1">⏳</span>}
                                          </div>
                                        </div>
                                        
                                        {repair.clientPhone && <div className="text-xs text-blue-600 dark:text-blue-400 font-medium mb-1">📞 {repair.clientPhone}</div>}
                                        <div className="text-gray-900 dark:text-gray-200 font-medium mb-1 text-xs sm:text-sm truncate">{repair.phone}</div>
                                        
                                        <div className="text-[10px] sm:text-xs text-gray-800 dark:text-gray-300 mb-2 truncate">
                                            {repair.isSAV && <span className="bg-red-600 text-white px-1.5 py-0.5 rounded mr-1 font-bold text-[9px] uppercase shadow-sm">SAV</span>}
                                            {repair.repair}
                                        </div>
                                        
                                        {repair.piece !== 'Aucune / En stock' && (
                                            <div 
                                                onClick={(e) => { e.stopPropagation(); togglePieces(repair.id); }}
                                                className={`bg-blue-50 dark:bg-blue-900/50 text-blue-800 dark:text-blue-200 text-[10px] sm:text-xs px-2 py-1.5 rounded border border-blue-300 dark:border-blue-700 mb-2 font-bold w-full cursor-pointer transition-all`}
                                                title="Cliquez pour afficher/masquer toutes les pièces"
                                            >
                                                {expandedPieces[repair.id] ? (
                                                    <div className="flex flex-col space-y-1">
                                                        <span className="border-b border-blue-200 dark:border-blue-700 pb-1 mb-1">🛒 Pièces à commander :</span>
                                                        {repair.piece.split(' + ').map((pItem, i) => (
                                                            <span key={i} className="whitespace-normal pl-1">👉 {pItem}</span>
                                                        ))}
                                                    </div>
                                                ) : (
                                                    <div className="truncate w-full">
                                                        🛒 {repair.piece}
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* CHAMP COMMENTAIRE DE RÉPARATION */}
                                        <textarea 
                                            className="w-full text-xs p-1.5 mt-2 rounded border border-gray-300 dark:border-gray-600 bg-white/50 dark:bg-gray-800/50 text-black dark:text-white resize-none outline-none focus:border-blue-500" 
                                            rows="2" 
                                            placeholder="Détail réparation / Note..." 
                                            defaultValue={repair.techComment || ''} 
                                            onBlur={(e) => handleCommentBlur(e, repair)}
                                            title="Ce commentaire est sauvegardé automatiquement dès que vous cliquez ailleurs."
                                        />

                                        {/* BOUTON D'OUVERTURE DE LA FICHE */}
                                        <button onClick={() => { setActiveIntake(repair); setView('intake'); }} className="w-full mt-2 bg-blue-100 dark:bg-blue-900/40 hover:bg-blue-200 dark:hover:bg-blue-900/60 text-blue-800 dark:text-blue-300 text-[10px] sm:text-xs py-1.5 rounded font-bold shadow-sm transition">
                                            📝 Fiche Prise en charge
                                        </button>
                                        
                                        <div className="flex flex-col lg:flex-row justify-between items-stretch mt-2 pt-2 border-t border-black/10 dark:border-white/10 gap-2 lg:gap-1">
                                          {repair.status !== 'done' && (
                                            <button onClick={() => updateRepairStatus(repair.id, 'done')} className="w-full lg:flex-1 bg-green-500 hover:bg-green-600 text-white text-[11px] sm:text-sm lg:text-xs py-2 lg:py-1 rounded font-bold shadow-sm transition">Terminé</button>
                                          )}
                                          
                                          {repair.status === 'waiting' && (
                                            <button onClick={async () => {
                                                const { doc, updateDoc } = window.FB_SDK;
                                                const revertDate = repair.previousDate || dateStr;
                                                await updateDoc(doc(window.db, "repairs", repair.id), { status: 'pending', date: revertDate });
                                            }} className="w-full lg:flex-1 bg-blue-500 hover:bg-blue-600 text-white text-[11px] sm:text-sm lg:text-xs py-2 lg:py-1 rounded font-bold shadow-sm transition">
                                                ↩ Annuler
                                            </button>
                                          )}

                                          {repair.status !== 'waiting' && repair.status !== 'done' && (
                                            <button onClick={async () => { 
                                                const tm = new Date(date); 
                                                tm.setDate(tm.getDate() + 1); 
                                                if (tm.getDay() === 0) tm.setDate(tm.getDate() + 1); 
                                                
                                                const { doc, updateDoc } = window.FB_SDK;
                                                await updateDoc(doc(window.db, "repairs", repair.id), { 
                                                    status: 'waiting', 
                                                    date: getLocalISO(tm),
                                                    previousDate: dateStr
                                                });
                                            }} className="w-full lg:flex-1 bg-yellow-400 hover:bg-yellow-500 text-black text-[11px] sm:text-sm lg:text-xs py-2 lg:py-1 rounded font-bold shadow-sm transition">Attente</button>
                                          )}
                                        </div>
                                        
                                        {/* BOUTONS AVEC TEXTE D'ORIGINE QUI ARCHIVENT */}
                                        {repair.status === 'done' ? (
                                            <div className="flex gap-2 mt-2">
                                                <button onClick={() => updateRepairStatus(repair.id, 'pending')} title="Annuler le statut Terminé" className="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 text-xs px-3 py-1.5 rounded font-bold shadow-sm transition flex items-center justify-center">
                                                    ↩
                                                </button>
                                                <button onClick={() => archiveRepair(repair.id)} className="flex-1 bg-gray-800 hover:bg-gray-900 dark:bg-gray-600 dark:hover:bg-gray-500 text-white text-xs sm:text-sm lg:text-xs py-2 lg:py-1.5 rounded font-bold shadow-sm transition flex justify-center items-center">
                                                    🗄️ Archiver
                                                </button>
                                            </div>
                                        ) : (
                                            <button onClick={() => archiveRepair(repair.id)} className="w-full mt-2 bg-gray-800 dark:bg-gray-600 hover:bg-gray-900 dark:hover:bg-gray-500 text-white text-[10px] sm:text-sm lg:text-xs py-2 lg:py-1.5 rounded font-bold shadow-sm transition">
                                                🗄️ Archiver direct
                                            </button>
                                        )}

                                      </div>
                                    ))}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProtectedApp />);
    </script>
</body>
</html>
