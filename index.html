    <script type="text/babel">
        const { useState, useEffect } = React;

        /* ==============================================================================
           SYSTÈME DE SÉCURITÉ PAR MOT DE PASSE (AVEC VISIBILITÉ)
           ============================================================================== */
        function ProtectedApp() {
            const [isAuthenticated, setIsAuthenticated] = useState(() => sessionStorage.getItem('auth') === 'true');
            const [passwordInput, setPasswordInput] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [error, setError] = useState(false);

            const SECRET_PASSWORD = "tech en carton"; 

            const handleLogin = (e) => {
                e.preventDefault();
                if (passwordInput === SECRET_PASSWORD) {
                    sessionStorage.setItem('auth', 'true');
                    setIsAuthenticated(true);
                } else {
                    setError(true);
                }
            };

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-900 p-4">
                        <form onSubmit={handleLogin} className="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-md w-full max-w-sm border border-gray-200 dark:border-gray-700">
                            <h2 className="text-xl font-bold text-gray-900 dark:text-white mb-4 text-center">🔒 Accès Sécurisé</h2>
                            <p className="text-sm text-gray-600 dark:text-gray-400 mb-6 text-center">Entrez le mot de passe de l'atelier pour accéder au planning.</p>
                            <input 
                                type={showPassword ? "text" : "password"} 
                                placeholder="Mot de passe..." 
                                value={passwordInput} 
                                onChange={(e) => { setPasswordInput(e.target.value); setError(false); }} 
                                className="w-full border border-gray-300 dark:border-gray-600 rounded-md p-3 mb-2 outline-none bg-white dark:bg-gray-700 text-black dark:text-white text-center font-bold"
                                autoFocus
                            />
                            
                            <div className="flex items-center justify-center mb-4 text-sm text-gray-600 dark:text-gray-300">
                                <input 
                                    type="checkbox" 
                                    id="showPass" 
                                    checked={showPassword} 
                                    onChange={() => setShowPassword(!showPassword)} 
                                    className="mr-2 cursor-pointer"
                                />
                                <label htmlFor="showPass" className="cursor-pointer select-none">Afficher le mot de passe</label>
                            </div>

                            {error && <p className="text-red-500 text-xs mb-3 text-center font-bold">Mot de passe incorrect</p>}
                            <button type="submit" className="w-full bg-blue-600 text-white font-medium py-3 rounded-md hover:bg-blue-700 transition">Se connecter</button>
                        </form>
                    </div>
                );
            }

            return <AppContent />;
        }

        const getLocalISO = (d) => {
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          return `${y}-${m}-${day}`;
        };

                </div>
                <div className="border-t border-l border-black mb-4">

                  <div className="grid grid-cols-4 border-b border-black text-xs font-bold text-center bg-blue-200 text-black">

                  <CheckRow category="fonction" label="Charge/USB" options={['OUI', 'NON', 'NT']} itemName="charge" formSync={formSync} updateCategorySync={updateCategorySync} />
                  <CheckRow category="fonction" label="Boutons lat." options={['OUI', 'NON', 'NT']} itemName="boutons" formSync={formSync} updateCategorySync={updateCategorySync} />
                  <CheckRow category="fonction" label="Réseau/Wifi" options={['OUI', 'NON', 'NT']} itemName="reseau" formSync={formSync} updateCategorySync={updateCategorySync} />
                </div>
                <div className="grid grid-cols-2 gap-4 mb-4">
                   <div className="border-t border-l border-black">
                      <div className="grid grid-cols-3 text-xs text-center font-bold bg-blue-200 border-b border-r border-black text-black">
                         <div className="border-r border-black p-1">Oxydation</div><div className="border-r border-black p-1">OUI</div><div className="p-1">NON</div>
                      </div>
                      <div className="grid grid-cols-3 text-xs text-center border-b border-r border-black text-black">
                         <div className="border-r border-black p-1 bg-blue-100 font-bold flex items-center justify-center">Oxydation</div>
                         <div className="border-r border-black p-1 cursor-pointer bg-white flex items-center justify-center" onClick={() => updateSync('oxydation', 'OUI')}>{formSync.oxydation === 'OUI' ? 'X' : ''}</div>
                         <div className="p-1 cursor-pointer bg-white flex items-center justify-center" onClick={() => updateSync('oxydation', 'NON')}>{formSync.oxydation === 'NON' ? 'X' : ''}</div>
                      </div>
                   </div>
                   <div className="border-t border-l border-black">
                      <div className="grid grid-cols-3 text-xs text-center font-bold bg-blue-200 border-b border-r border-black text-black">
                         <div className="border-r border-black p-1">SIM</div><div className="border-r border-black p-1">OUI</div><div className="p-1">NON</div>
                      </div>
                      <div className="grid grid-cols-3 text-xs text-center border-b border-r border-black text-black">

                    <input className="w-full p-1 outline-none text-center bg-white text-black" value={formSync.codeDev} onChange={e => updateSync('codeDev', e.target.value)} />
                  </div>

                    <span className="bg-blue-200 p-1 font-bold border-r border-black text-black flex items-center">Code sim</span>
                    <input className="w-full p-1 outline-none text-center bg-white text-black" value={formSync.codeSim} onChange={e => updateSync('codeSim', e.target.value)} />
                  </div>

                    <span className="bg-blue-200 p-1 font-bold border-r border-black text-black flex items-center">VENDEUR</span>
                    <select className="w-full p-1 outline-none text-center font-bold uppercase bg-white text-black cursor-pointer" value={formSync.vendeur} onChange={e => updateSync('vendeur', e.target.value)} style={{ textAlignLast: 'center' }}>
                      <option value="">- CHOISIR -</option>
                      <option value="Clément">CLÉMENT</option>
                      <option value="Bérénys">BÉRÉNYS</option>
                      <option value="Gérard">GÉRARD</option>
                    </select>

                </div>
                <div className="border-t border-l border-black mb-4">
                  <div className="bg-blue-300 font-bold text-center border-r border-b border-black p-1 text-sm text-black">DEVIS DE RÉPARATION</div>
                  <div className="grid grid-cols-2 border-b border-black text-xs font-bold text-center bg-blue-200 text-black">
                    <div className="border-r border-black p-1">RÉPARATION</div><div className="border-r border-black p-1">PRIX</div>
                  </div>
                  <div className="grid grid-cols-2 border-b border-black text-xs text-center text-black">
                    <div className="border-r border-black p-1 font-semibold bg-white flex items-center justify-center">{activeIntake.repair}</div>
                    <div className="border-r border-black p-1 flex items-center justify-center bg-white"><input type="number" className="w-16 text-center outline-none border-b border-dashed border-gray-400 mr-1 bg-white text-black" value={formSync.prix} onChange={e => updateSync('prix', e.target.value)} /> €</div>
                  </div>
                </div>
            </div>
            <div>
                <div className="border-t border-l border-black mb-4 flex flex-col">
                  <div className="bg-blue-300 font-bold text-center border-r border-b border-black p-1 text-xs text-black">COMMENTAIRE</div>
                  <textarea className="w-full h-12 p-2 text-xs border-r border-b border-black outline-none resize-none bg-white text-black" value={formSync.commentaire} onChange={e => updateSync('commentaire', e.target.value)} />
                </div>
                <div className="border border-black h-20 relative bg-white"><div className="bg-blue-200 font-bold text-center border-b border-black p-1 text-xs text-black">SIGNATURE</div></div>
            </div>

        );

        const IntakeView = ({ activeIntake, setView }) => {
          const [formSync, setFormSync] = useState({ numero: activeIntake.clientPhone || '', accessoire: '', vendeur: '', prix: '', commentaire: '', codeDev: '', codeSim: '', etat: {}, fonction: {}, oxydation: '', sim: '' });
          const updateSync = (field, value) => setFormSync(prev => ({ ...prev, [field]: value }));
          const updateCategorySync = (category, item, value) => setFormSync(prev => ({ ...prev, [category]: { ...prev[category], [item]: value } }));

          return (
            <div className="min-h-screen bg-gray-100 dark:bg-gray-900 p-4 print:p-0 print:bg-white text-black transition-colors duration-200 overflow-auto flex-1">
              <div className="max-w-6xl mx-auto h-full">
                <div className="flex justify-between items-center mb-4 print:hidden">
                  <button onClick={() => setView('planning')} className="bg-gray-800 dark:bg-gray-700 text-white px-4 py-2 rounded shadow hover:bg-gray-700 dark:hover:bg-gray-600 transition">&larr; Retour au planning</button>
                  <h1 className="text-xl font-bold text-gray-900 dark:text-white">Bon de prise en charge</h1>
                  <button onClick={() => window.print()} className="bg-blue-600 text-white px-6 py-2 rounded shadow hover:bg-blue-700 font-bold flex items-center">Imprimer (A4)</button>
                </div>
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 h-full print:gap-4 print:h-screen print:grid-cols-2">
                  <FormHalf title="EXEMPLAIRE BOUTIQUE" activeIntake={activeIntake} formSync={formSync} updateSync={updateSync} updateCategorySync={updateCategorySync} />
                  <FormHalf title="EXEMPLAIRE CLIENT" activeIntake={activeIntake} formSync={formSync} updateSync={updateSync} updateCategorySync={updateCategorySync} />
                </div>
              </div>
            </div>
          );
        };

        const WIPView = ({ setView, onOpenNav }) => {
            return (
                <div className="min-h-screen bg-gray-50 dark:bg-gray-900 flex flex-col text-black dark:text-white transition-colors duration-200 flex-1 w-full">
                    <div className="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 p-4 flex items-center shadow-sm">
                        <button onClick={onOpenNav} className="mr-4 p-2 bg-gray-100 dark:bg-gray-700 rounded-md hover:bg-gray-200 dark:hover:bg-gray-600 transition flex items-center justify-center">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                        </button>
                        <h1 className="text-xl font-bold text-gray-900 dark:text-white">Autre page</h1>
                    </div>
                    <div className="flex-1 flex items-center justify-center p-4">
                        <div className="text-center bg-white dark:bg-gray-800 p-10 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 max-w-lg">
                            <div className="text-6xl mb-6">🛠️</div>
                            <h1 className="text-3xl font-bold mb-4">Page en cours de programmage</h1>

                        </div>

            );
        };

        function AppContent() {
          const [repairs, setRepairs] = useState([]);
          const [currentDate, setCurrentDate] = useState(new Date());
          const [view, setView] = useState('planning');
          const [activeIntake, setActiveIntake] = useState(null);
          const [isNavOpen, setIsNavOpen] = useState(false);
          const [expandedPieces, setExpandedPieces] = useState({});
          
          const [formData, setFormData] = useState({ 
              client: '', clientPhone: '', phone: '', repair: '', date: getLocalISO(new Date()), 
              pieces: [], customPiece: '', pieceSuppliers: {}, customPieceSuppliers: {},
              isSAV: false // <-- NOUVEAU CHAMP SAV
          });
          
          const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');

          useEffect(() => {
              const today = new Date();
              let targetDate = new Date(today);

              if (formData.pieces.length > 0) {
                  if (today.getDay() === 6) { 
                      targetDate.setDate(today.getDate() + 3); 
                  } else {
                      targetDate.setDate(today.getDate() + 1); 
                  }
              } else {
                  targetDate = today; 
              }

              const newDateISO = getLocalISO(targetDate);
              setFormData(prev => {
                  if (prev.date !== newDateISO) {
                      return { ...prev, date: newDateISO };
                  }
                  return prev;
              });
          }, [formData.pieces]);

          useEffect(() => {
            const handleFirebaseReady = () => {
              const { collection, onSnapshot } = window.FB_SDK;
              const unsubscribe = onSnapshot(collection(window.db, "repairs"), (snapshot) => {
                const loadedRepairs = snapshot.docs.map(doc => ({
                  id: doc.id,
                  ...doc.data()
                }));
                setRepairs(loadedRepairs);
              });
              return unsubscribe;
            };

            if (window.FB_SDK) {
              handleFirebaseReady();
            } else {
              window.addEventListener('firebase-ready', handleFirebaseReady);
            }
          }, []);

          useEffect(() => {
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
          }, [isDarkMode]);

          const weekDates = (() => {
            const curr = new Date(currentDate);
            const day = curr.getDay() || 7; 
            const monday = new Date(curr);
            monday.setDate(curr.getDate() - day + 1); 
            const days = [];
            for (let i = 0; i < 6; i++) { 
              const d = new Date(monday);
              d.setDate(monday.getDate() + i);
              days.push(d);
            }
            return days;
          })();

          const handleSubmit = async (e) => {
            e.preventDefault();
            if (!formData.client || !formData.phone || !formData.repair) return;
            let submitDate = formData.date;
            const dCheck = new Date(submitDate);
            if (dCheck.getDay() === 0) {
                dCheck.setDate(dCheck.getDate() + 1); 
                submitDate = getLocalISO(dCheck);
            }
            
            let finalPieceStrings = [];
            formData.pieces.forEach(p => {
                let pName = p;
                if (p === 'Autre' && formData.customPiece) {
                    pName = formData.customPiece;
                } else if (p === 'Autre') {
                    return; 
                }

                let sup = formData.pieceSuppliers[p] || '';
                if (sup === 'Autre') {
                    sup = formData.customPieceSuppliers[p] || '';
                }

                if (sup) {
                    finalPieceStrings.push(`${pName} (${sup})`);
                } else {
                    finalPieceStrings.push(pName);
                }
            });

            const pieceString = finalPieceStrings.length > 0 ? finalPieceStrings.join(' + ') : 'Aucune / En stock';
            
            const newRepair = { 
                client: formData.client, clientPhone: formData.clientPhone, phone: formData.phone, repair: formData.repair,
                date: submitDate, 
                piece: pieceString, 
                supplier: '', 
                status: 'pending',
                order: Date.now(), 
                isPriority: false,
                isSAV: formData.isSAV // <-- ENVOI DU STATUT SAV
            };

            const { collection, addDoc } = window.FB_SDK;
            const docRef = await addDoc(collection(window.db, "repairs"), newRepair);

            setFormData({ 
                client: '', clientPhone: '', phone: '', repair: '', date: getLocalISO(new Date()), 
                pieces: [], customPiece: '', pieceSuppliers: {}, customPieceSuppliers: {}, isSAV: false 
            });
            setActiveIntake({ id: docRef.id, ...newRepair });
            setView('intake');
          };

          const updateRepairStatus = async (id, newStatus) => {
            const { doc, updateDoc } = window.FB_SDK;
            await updateDoc(doc(window.db, "repairs", id), { status: newStatus });
          };

          const updateRepairDate = async (id, newDate) => {
            const { doc, updateDoc } = window.FB_SDK;
            await updateDoc(doc(window.db, "repairs", id), { date: newDate });
          };

          const deleteRepair = async (id) => {
            const { doc, deleteDoc } = window.FB_SDK;
            await deleteDoc(doc(window.db, "repairs", id));
          };

          const togglePriority = async (id, currentVal) => {
            const { doc, updateDoc } = window.FB_SDK;
            await updateDoc(doc(window.db, "repairs", id), { isPriority: !currentVal });
          };

          const handleDrop = async (e, targetDateStr, targetRepairId = null) => {
            e.preventDefault();
            e.stopPropagation();
            const draggedId = e.dataTransfer.getData('repairId');
            if (!draggedId || draggedId === targetRepairId) return;

            const draggedRepair = repairs.find(r => r.id === draggedId);
            if (!draggedRepair) return;

            let targetDayRepairs = repairs.filter(r => r.date === targetDateStr).sort((a, b) => {
                if (a.isPriority && !b.isPriority) return -1;
                if (!a.isPriority && b.isPriority) return 1;
                return (a.order || 0) - (b.order || 0);
            });

            targetDayRepairs = targetDayRepairs.filter(r => r.id !== draggedId);

            if (targetRepairId) {
                const targetIndex = targetDayRepairs.findIndex(r => r.id === targetRepairId);
                if (targetIndex !== -1) {
                    targetDayRepairs.splice(targetIndex, 0, draggedRepair);
                } else {
                    targetDayRepairs.push(draggedRepair);
                }
            } else {
                targetDayRepairs.push(draggedRepair);
            }

            const { doc, updateDoc } = window.FB_SDK;
            targetDayRepairs.forEach((rep, index) => {
                const newOrder = index * 10;
                if (rep.id === draggedId) {
                    updateDoc(doc(window.db, "repairs", rep.id), { date: targetDateStr, order: newOrder });
                } else if (rep.order !== newOrder) {
                    updateDoc(doc(window.db, "repairs", rep.id), { order: newOrder });
                }
            });
          };

          const togglePieces = (id) => {
              setExpandedPieces(prev => ({ ...prev, [id]: !prev[id] }));
          };

          const getStatusColors = (repair) => {
            if(repair.status === 'done') return 'bg-green-100 dark:bg-green-900/40 border-green-500 text-green-900 dark:text-green-100';
            if(repair.status === 'waiting') return 'bg-yellow-100 dark:bg-yellow-900/40 border-yellow-500 text-yellow-900 dark:text-yellow-100';
            if(repair.isPriority) return 'bg-red-100 dark:bg-red-900/40 border-red-500 text-red-900 dark:text-red-100 border-2 shadow-[0_0_8px_rgba(239,68,68,0.4)]';
            return 'bg-white dark:bg-gray-700 border-gray-200 dark:border-gray-600 shadow-sm'; 
          };

          return (
            <div className="flex w-full min-h-screen">
              {isNavOpen && (
                <div className="fixed inset-0 bg-black/50 z-40 transition-opacity print:hidden" onClick={() => setIsNavOpen(false)}></div>
              )}
              
              <div className={`fixed inset-y-0 left-0 w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 shadow-2xl z-50 transform transition-transform duration-300 print:hidden ${isNavOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                  <div className="p-6">
                      <div className="flex justify-between items-center mb-8 border-b border-gray-200 dark:border-gray-700 pb-4">
                          <h2 className="text-xl font-bold text-gray-900 dark:text-white">Menu</h2>
                          <button onClick={() => setIsNavOpen(false)} className="text-gray-500 hover:text-red-500 text-2xl font-bold leading-none">&times;</button>
                      </div>
                      <div className="space-y-3">
                          <button onClick={() => { setView('planning'); setIsNavOpen(false); }} className={`w-full text-left p-3 rounded-md font-bold transition flex items-center ${view === 'planning' ? 'bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300' : 'hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200'}`}>
                              <span className="mr-3">📅</span> Planning
                          </button>
                          <button onClick={() => { setView('wip'); setIsNavOpen(false); }} className={`w-full text-left p-3 rounded-md font-bold transition flex items-center ${view === 'wip' ? 'bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300' : 'hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200'}`}>
                              <span className="mr-3">⚙️</span> Autre page
                          </button>
                      </div>
                  </div>
              </div>

              {view === 'intake' && activeIntake ? (
                  <IntakeView activeIntake={activeIntake} setView={setView} />
              ) : view === 'wip' ? (
                  <WIPView setView={setView} onOpenNav={() => setIsNavOpen(true)} />
              ) : (
                <div className="flex flex-col lg:flex-row w-full font-sans text-black dark:text-white transition-colors duration-200">
                  <div className="w-full lg:w-80 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 p-4 lg:p-6 flex flex-col shadow-sm z-10 transition-colors duration-200 overflow-y-auto">
                    <div className="flex justify-between items-center mb-6">
                        <div className="flex items-center">
                            <button onClick={() => setIsNavOpen(true)} className="mr-3 p-2 bg-gray-100 dark:bg-gray-700 rounded-md hover:bg-gray-200 dark:hover:bg-gray-600 transition flex items-center justify-center" title="Ouvrir le menu">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                            </button>
                            <h1 className="text-xl font-bold text-gray-900 dark:text-white flex items-center">Planning</h1>
                        </div>
                        <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 bg-gray-100 dark:bg-gray-700 rounded-full hover:bg-gray-200 dark:hover:bg-gray-600 transition" title="Changer de thème">
                            {isDarkMode ? '☀️' : '🌙'}
                        </button>
                    </div>
                    
                    <form onSubmit={handleSubmit} className="flex-1 space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-gray-800 dark:text-gray-200 mb-1">Nom du client</label>
                        <input type="text" required value={formData.client} onChange={e => setFormData({...formData, client: e.target.value})} className="w-full border border-gray-300 dark:border-gray-600 rounded-md p-2 outline-none bg-white dark:bg-gray-700 text-black dark:text-white" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-gray-800 dark:text-gray-200 mb-1">N° de téléphone (Client)</label>
                        <input type="tel" required value={formData.clientPhone} onChange={e => setFormData({...formData, clientPhone: e.target.value})} placeholder="06..." className="w-full border border-gray-300 dark:border-gray-600 rounded-md p-2 outline-none bg-white dark:bg-gray-700 text-black dark:text-white" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-gray-800 dark:text-gray-200 mb-1">Modèle de l'appareil</label>
                        <input type="text" required value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} className="w-full border border-gray-300 dark:border-gray-600 rounded-md p-2 outline-none bg-white dark:bg-gray-700 text-black dark:text-white" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-gray-800 dark:text-gray-200 mb-1">Réparation</label>
                        <input type="text" required value={formData.repair} onChange={e => setFormData({...formData, repair: e.target.value})} className="w-full border border-gray-300 dark:border-gray-600 rounded-md p-2 outline-none bg-white dark:bg-gray-700 text-black dark:text-white" />
                      </div>
                      
                      {/* === NOUVELLE CASE SAV === */}
                      <div className="pt-1">
                          <label className="flex items-center space-x-2 text-sm font-medium text-gray-800 dark:text-gray-200 cursor-pointer bg-red-50 dark:bg-red-900/20 p-2.5 rounded-md border border-red-200 dark:border-red-800 transition hover:bg-red-100 dark:hover:bg-red-900/40">
                              <input 
                                  type="checkbox" 
                                  checked={formData.isSAV} 
                                  onChange={(e) => setFormData({...formData, isSAV: e.target.checked})}
                                  className="rounded border-red-300 text-red-600 w-5 h-5 cursor-pointer focus:ring-red-500"
                              />
                              <span className="text-red-700 dark:text-red-400 font-bold tracking-wide">⚠️ RETOUR SAV (GARANTIE)</span>
                          </label>
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-gray-800 dark:text-gray-200 mb-2 mt-2">Pièce(s) Commandée(s)</label>
                        <div className="grid grid-cols-2 gap-2 mb-2">
                            {['Écran', 'Batterie', 'Dock de charge', 'Nappe', 'Caméra Avant', 'Caméra Arrière', 'Vitre arr.'].map(p => (
                                <label key={p} className="flex items-center space-x-2 text-sm text-gray-800 dark:text-gray-200 cursor-pointer bg-gray-50 dark:bg-gray-700/50 p-2 rounded-md border border-gray-200 dark:border-gray-600">
                                    <input 
                                        type="checkbox" 
                                        checked={formData.pieces.includes(p)} 
                                        onChange={(e) => {
                                            const newPieces = e.target.checked 
                                                ? [...formData.pieces, p] 
                                                : formData.pieces.filter(x => x !== p);
                                            setFormData({...formData, pieces: newPieces});
                                        }}
                                        className="rounded border-gray-300 text-blue-600 w-4 h-4 cursor-pointer"
                                    />
                                    <span className="truncate">{p}</span>
                                </label>
                            ))}
                            <label className="col-span-2 flex items-center space-x-2 text-sm text-gray-800 dark:text-gray-200 cursor-pointer bg-gray-50 dark:bg-gray-700/50 p-2 rounded-md border border-gray-200 dark:border-gray-600">
                                <input 
                                    type="checkbox" 
                                    checked={formData.pieces.includes('Autre')} 
                                    onChange={(e) => {
                                        const newPieces = e.target.checked 
                                            ? [...formData.pieces, 'Autre'] 
                                            : formData.pieces.filter(x => x !== 'Autre');
                                        setFormData({...formData, pieces: newPieces});
                                    }}
                                    className="rounded border-gray-300 text-blue-600 w-4 h-4 cursor-pointer"
                                />
                                <span className="truncate">Autre chose (préciser)...</span>
                            </label>
                        </div>
                      </div>

                      {formData.pieces.includes('Autre') && (
                          <div className="mb-4">
                            <label className="block text-sm font-medium text-gray-800 dark:text-gray-200 mb-1">Précisez la pièce</label>
                            <input type="text" required value={formData.customPiece} onChange={e => setFormData({...formData, customPiece: e.target.value})} className="w-full border border-gray-300 dark:border-gray-600 rounded-md p-2 outline-none bg-white dark:bg-gray-700 text-black dark:text-white" />
                          </div>
                      )}
                      
                      {formData.pieces.length > 0 && (
                        <div className="space-y-3 mt-4 border-t border-gray-200 dark:border-gray-700 pt-4">
                            <label className="block text-sm font-bold text-gray-800 dark:text-gray-200">Fournisseur(s) optionnel(s)</label>
                            {formData.pieces.map(p => {
                                const displayName = p === 'Autre' ? (formData.customPiece || 'Autre pièce') : p;
                                return (
                                    <div key={p} className="flex flex-col bg-gray-50 dark:bg-gray-700/30 p-2 rounded border border-gray-200 dark:border-gray-600">
                                        <span className="text-xs font-semibold mb-1 text-gray-700 dark:text-gray-300">{displayName}</span>
                                        <select 
                                            value={formData.pieceSuppliers[p] || ''} 
                                            onChange={e => setFormData({...formData, pieceSuppliers: { ...formData.pieceSuppliers, [p]: e.target.value }})}
                                            className="w-full border border-gray-300 dark:border-gray-600 rounded-md p-1.5 outline-none bg-white dark:bg-gray-700 text-black dark:text-white text-sm"
                                        >
                                            <option value="">-- Aucun --</option>
                                            <option value="Utopya">Utopya</option>
                                            <option value="Mobilax">Mobilax</option>
                                            <option value="Amazon">Amazon</option>
                                            <option value="Autre">Autre (préciser)...</option>
                                        </select>
                                        
                                        {formData.pieceSuppliers[p] === 'Autre' && (
                                            <input 
                                                type="text" 
                                                placeholder="Nom du fournisseur..." 
                                                required 
                                                value={formData.customPieceSuppliers[p] || ''} 
                                                onChange={e => setFormData({...formData, customPieceSuppliers: { ...formData.customPieceSuppliers, [p]: e.target.value }})}
                                                className="w-full border border-gray-300 dark:border-gray-600 rounded-md p-1.5 outline-none bg-white dark:bg-gray-700 text-black dark:text-white text-sm mt-2" 
                                            />
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                      )}

                      <div>
                        <label className="block text-sm font-medium text-gray-800 dark:text-gray-200 mb-1 mt-4">Date prévue</label>
                        <input type="date" required value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} className="w-full border border-gray-300 dark:border-gray-600 rounded-md p-2 outline-none bg-white dark:bg-gray-700 text-black dark:text-white" />
                      </div>
                      <button type="submit" className="w-full mt-6 bg-blue-600 text-white font-medium py-3 rounded-md hover:bg-blue-700 transition">+ Ajouter au planning</button>
                    </form>
                  </div>

                  <div className="flex-1 flex flex-col min-w-0 overflow-hidden bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
                    <div className="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 p-4 flex flex-col sm:flex-row justify-between items-center shadow-sm gap-2 sm:gap-0">
                      <div className="flex items-center space-x-2 sm:space-x-4">
                        <button onClick={() => {const d = new Date(currentDate); d.setDate(d.getDate() - 7); setCurrentDate(d);}} className="p-2 bg-gray-100 dark:bg-gray-700 rounded-full hover:bg-gray-200 dark:hover:bg-gray-600 text-black dark:text-white">&larr;</button>
                        <h2 className="text-sm sm:text-xl font-bold text-gray-900 dark:text-white text-center">
                            Du {weekDates[0].toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'})} <br className="sm:hidden" />au {weekDates[5].toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'})}
                        </h2>
                        <button onClick={() => {const d = new Date(currentDate); d.setDate(d.getDate() + 7); setCurrentDate(d);}} className="p-2 bg-gray-100 dark:bg-gray-700 rounded-full hover:bg-gray-200 dark:hover:bg-gray-600 text-black dark:text-white">&rarr;</button>
                      </div>
                      <button onClick={() => setCurrentDate(new Date())} className="px-4 py-2 bg-blue-50 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 font-bold rounded-md hover:bg-blue-100 dark:hover:bg-blue-900/60 transition w-full sm:w-auto">Aujourd'hui</button>
                    </div>

                    <div className="flex-1 p-2 sm:p-4 overflow-y-auto overflow-x-hidden">
                      <div className="grid grid-cols-3 lg:grid-cols-6 gap-2 sm:gap-3 h-auto lg:h-full min-h-[500px] lg:min-h-0">
                        {weekDates.map((date, idx) => {
                          const dateStr = getLocalISO(date);
                          const isToday = dateStr === getLocalISO(new Date());
                          
                          const dayRepairs = repairs.filter(r => r.date === dateStr).sort((a, b) => {
                              if (a.isPriority && !b.isPriority) return -1;
                              if (!a.isPriority && b.isPriority) return 1;
                              return (a.order || 0) - (b.order || 0);
                          });

                          return (
                            <div key={idx} 
                                 onDragOver={e=>e.preventDefault()} 
                                 onDrop={(e) => handleDrop(e, dateStr)} 
                                 className={`flex flex-col rounded-lg overflow-hidden transition-all duration-200 min-h-[300px] lg:min-h-0
                                 ${isToday ? 'bg-blue-50 dark:bg-blue-900/10 border-2 border-blue-500 shadow-md' : 'bg-gray-100 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700'}`}>
                              
                              <div className={`p-1 sm:p-2 text-center border-b font-bold text-xs sm:text-sm 
                                              ${isToday ? 'bg-blue-600 text-white border-blue-600' : 'bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 border-gray-300 dark:border-gray-600'}`}>
                                {['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'][date.getDay()]} <br className="lg:hidden" /> {String(date.getDate()).padStart(2, '0')}/{String(date.getMonth() + 1).padStart(2, '0')}
                              </div>
                              
                              <div className="flex-1 overflow-y-auto p-1 sm:p-2 space-y-2">
                                {dayRepairs.map(repair => (
                                  <div key={repair.id} 
                                       draggable 
                                       onDragStart={(e) => e.dataTransfer.setData('repairId', repair.id)} 
                                       onDragOver={(e) => e.preventDefault()}
                                       onDrop={(e) => handleDrop(e, dateStr, repair.id)}
                                       className={`p-2 sm:p-3 rounded-md border text-sm cursor-grab border-opacity-50 ${getStatusColors(repair)} relative`}
                                  >
                                    <div className="font-bold flex justify-between items-start mb-1 text-black dark:text-white">
                                      <span className="text-xs sm:text-sm truncate pr-2">{repair.client}</span>
                                      <div className="flex space-x-1 flex-shrink-0">
                                          {repair.status !== 'done' && (
                                              <button 
                                                  onClick={() => togglePriority(repair.id, repair.isPriority)}
                                                  className={`text-[10px] px-1.5 py-0.5 rounded shadow-sm transition ${repair.isPriority ? 'bg-red-500 hover:bg-red-600 text-white' : 'bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300'}`}
                                                  title="Mettre en priorité"
                                              >
                                                  {repair.isPriority ? '🔥 Urgent' : '⭐'}
                                              </button>
                                          )}
                                          {repair.status === 'done' && <span className="text-green-700 dark:text-green-400 font-bold ml-1">✓</span>}
                                          {repair.status === 'waiting' && <span className="text-yellow-700 dark:text-yellow-400 font-bold ml-1">⏳</span>}
                                      </div>
                                    </div>
                                    
                                    {repair.clientPhone && <div className="text-xs text-blue-600 dark:text-blue-400 font-medium mb-1">📞 {repair.clientPhone}</div>}
                                    <div className="text-gray-900 dark:text-gray-200 font-medium mb-1 text-xs sm:text-sm truncate">{repair.phone}</div>
                                    
                                    <div className="text-[10px] sm:text-xs text-gray-800 dark:text-gray-300 mb-2 truncate">
                                        {/* AFFICHAGE DU BADGE SAV */}
                                        {repair.isSAV && <span className="bg-red-600 text-white px-1.5 py-0.5 rounded mr-1 font-bold text-[9px] uppercase shadow-sm">SAV</span>}
                                        {repair.repair}
                                    </div>
                                    
                                    {repair.piece !== 'Aucune / En stock' && (
                                        <div 
                                            onClick={(e) => { e.stopPropagation(); togglePieces(repair.id); }}
                                            className={`bg-blue-50 dark:bg-blue-900/50 text-blue-800 dark:text-blue-200 text-[10px] sm:text-xs px-2 py-1.5 rounded border border-blue-300 dark:border-blue-700 mb-2 font-bold w-full cursor-pointer transition-all`}
                                            title="Cliquez pour afficher/masquer toutes les pièces"
                                        >
                                            {expandedPieces[repair.id] ? (
                                                <div className="flex flex-col space-y-1">
                                                    <span className="border-b border-blue-200 dark:border-blue-700 pb-1 mb-1">🛒 Pièces à commander :</span>
                                                    {repair.piece.split(' + ').map((pItem, i) => (
                                                        <span key={i} className="whitespace-normal pl-1">👉 {pItem}</span>
                                                    ))}
                                                </div>
                                            ) : (
                                                <div className="truncate w-full">
                                                    🛒 {repair.piece}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                    
                                    <div className="flex flex-col lg:flex-row justify-between items-stretch mt-2 pt-2 border-t border-black/10 dark:border-white/10 gap-2 lg:gap-1">
                                      {repair.status !== 'done' && (
                                        <button onClick={() => updateRepairStatus(repair.id, 'done')} className="w-full lg:flex-1 bg-green-500 hover:bg-green-600 text-white text-[11px] sm:text-sm lg:text-xs py-2 lg:py-1 rounded font-bold shadow-sm transition">Terminé</button>
                                      )}
                                      
                                      {repair.status === 'waiting' && (
                                        <button onClick={async () => {
                                            const { doc, updateDoc } = window.FB_SDK;
                                            const revertDate = repair.previousDate || dateStr;
                                            await updateDoc(doc(window.db, "repairs", repair.id), { status: 'pending', date: revertDate });
                                        }} className="w-full lg:flex-1 bg-blue-500 hover:bg-blue-600 text-white text-[11px] sm:text-sm lg:text-xs py-2 lg:py-1 rounded font-bold shadow-sm transition">
                                            ↩ Annuler
                                        </button>
                                      )}

                                      {repair.status !== 'waiting' && repair.status !== 'done' && (
                                        <button onClick={async () => { 
                                            const tm = new Date(date); 
                                            tm.setDate(tm.getDate() + 1); 
                                            if (tm.getDay() === 0) tm.setDate(tm.getDate() + 1); 
                                            
                                            const { doc, updateDoc } = window.FB_SDK;
                                            await updateDoc(doc(window.db, "repairs", repair.id), { 
                                                status: 'waiting', 
                                                date: getLocalISO(tm),
                                                previousDate: dateStr
                                            });
                                        }} className="w-full lg:flex-1 bg-yellow-400 hover:bg-yellow-500 text-black text-[11px] sm:text-sm lg:text-xs py-2 lg:py-1 rounded font-bold shadow-sm transition">Attente</button>
                                      )}
                                    </div>
                                    
                                    {repair.status === 'done' ? (
                                        <div className="flex gap-2 mt-2">
                                            <button onClick={() => updateRepairStatus(repair.id, 'pending')} title="Annuler le statut Terminé" className="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 text-xs px-3 py-1.5 rounded font-bold shadow-sm transition flex items-center justify-center">
                                                ↩
                                            </button>
                                            <button onClick={() => deleteRepair(repair.id)} className="flex-1 bg-purple-600 hover:bg-purple-700 text-white text-xs sm:text-sm lg:text-xs py-2 lg:py-1.5 rounded font-bold shadow-sm transition flex justify-center items-center">
                                                📞 Appelé (Suppr.)
                                            </button>
                                        </div>
                                    ) : (
                                        <button onClick={() => deleteRepair(repair.id)} className="w-full mt-2 bg-gray-800 dark:bg-gray-600 hover:bg-gray-900 dark:hover:bg-gray-500 text-white text-[10px] sm:text-sm lg:text-xs py-2 lg:py-1.5 rounded font-bold shadow-sm transition">
                                            Récupéré (Sup)
                                        </button>
                                    )}

                                  </div>
                                ))}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProtectedApp />);
    </script>
</body>
</html>
