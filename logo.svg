<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fond sombre -->
  <rect width="512" height="512" rx="112" fill="#0f172a" />
  
  <!-- Smartphone Silhouette -->
  <rect x="156" y="80" width="200" height="352" rx="32" fill="#1e293b" stroke="#334155" stroke-width="12" />
  <circle cx="256" cy="390" r="14" fill="#334155" />
  
  <!-- Ligne de diagnostic (Pouls) en néon cyan -->
  <path d="M 80 256 L 180 256 L 210 160 L 270 360 L 310 256 L 432 256" 
        fill="none" stroke="#00f2fe" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" filter="url(#neon)" />
</svg>
