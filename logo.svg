<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dégradé bleu/violet style Néon -->
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- TICKET 1 (Arrière-plan, incliné) -->
    <g transform="translate(140, 240) rotate(-20) translate(-140, -240)" fill="none" stroke="url(#neon)" stroke-width="12" stroke-linejoin="round" opacity="0.5">
      <path d="M 70 120 L 210 120 A 20 20 0 0 1 230 140 L 230 190 A 25 25 0 0 0 230 240 L 230 360 A 20 20 0 0 1 210 380 L 70 380 A 20 20 0 0 1 50 360 L 50 240 A 25 25 0 0 0 50 190 L 50 140 A 20 20 0 0 1 70 120 Z" />
      <line x1="110" y1="120" x2="110" y2="380" stroke-width="8" stroke-dasharray="10 10" />
    </g>

    <!-- TICKET 2 (Premier plan, droit) -->
    <g transform="translate(60, -10)" fill="none" stroke="url(#neon)" stroke-width="16" stroke-linejoin="round">
      <path d="M 180 140 L 360 140 A 20 20 0 0 1 380 160 L 380 220 A 30 30 0 0 0 380 280 L 380 400 A 20 20 0 0 1 360 420 L 180 420 A 20 20 0 0 1 160 400 L 160 280 A 30 30 0 0 0 160 220 L 160 160 A 20 20 0 0 1 180 140 Z" />
      <line x1="220" y1="140" x2="220" y2="420" stroke-width="10" stroke-dasharray="12 12" />
    </g>

    <!-- CLÉ À MOLETTE AU CENTRE -->
    <g transform="translate(60, -10)" fill="none" stroke="url(#neon)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <!-- Tête de la clé -->
      <path d="M 285 240 C 265 220 230 225 215 250 C 225 255 240 260 240 275 C 240 290 225 295 215 300 C 230 325 265 330 285 310" />
      <!-- Manche -->
      <line x1="270" y1="295" x2="330" y2="355" stroke-width="18" />
      <circle cx="335" cy="360" r="5" fill="url(#neon)" />
    </g>
  </g>
</svg>
